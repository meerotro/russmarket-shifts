name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Pint, Pest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: russmarket
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: russmarket_shifts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U russmarket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: russmarket_shifts_test
      DB_USERNAME: russmarket
      DB_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, intl
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: php artisan test

  frontend:
    name: Frontend (ESLint, Prettier, vue-tsc, Vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
